name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "${{ startsWith(github.event.head_commit.message, 'chore: bump version') }}"

    steps:
      - uses: actions/checkout@v4
        with:
          path: recibeexamen

      - name: Get version from version.php
        id: version
        run: |
          RELEASE=$(grep -E "release\s*=" recibeexamen/version.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Create ZIP
        run: |
          zip -r recibeexamen.zip recibeexamen \
            -x "recibeexamen/.git/*" \
            -x "recibeexamen/.gitignore" \
            -x "recibeexamen/.github/*" \
            -x "recibeexamen/hooks/*"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.release }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.version.outputs.release }}" \
            --latest \
            recibeexamen.zip
